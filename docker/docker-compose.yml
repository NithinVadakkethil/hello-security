services:
  postgres:
    image: postgres:17

    container_name: hello-security-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hello_security

    ports:
      - '5432:5432'

    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine

    container_name: hello-security-redis

    restart: unless-stopped

    ports:
      - '6379:6379'

    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
